<script>
async function loadArticles() {
  const container = document.getElementById("article-list");

  try {
    const res = await fetch("/articles.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!res.ok) {
      throw new Error("articles.json の取得に失敗しました");
    }

    const data = await res.json();

    container.innerHTML = "";

    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = "<div class='card'>まだ記事がありません</div>";
      return;
    }

    data.slice().reverse().forEach(article => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h2>${article.title || "無題の記事"}</h2>
        <p>${article.summary || "記事概要はありません"}</p>
        <a href="/article.html?id=${article.id}">続きを読む →</a>
      `;

      container.appendChild(div);
    });

  } catch (error) {
    container.innerHTML = `
      <div class="card">
        記事読み込みエラー<br>
        ${error.message}
      </div>
    `;
    console.error(error);
  }
}

document.addEventListener("DOMContentLoaded", loadArticles);
</script>
