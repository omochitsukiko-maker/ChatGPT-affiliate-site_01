<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>副業で月5万円を目指すメディア</title>
<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fa;
  color:#333;
}
header{
  background:#1e88e5;
  color:white;
  padding:32px 20px;
  text-align:center;
}
.container{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}
.card{
  background:white;
  padding:24px;
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
.card h2{
  margin-top:0;
  font-size:22px;
}
.card a{
  text-decoration:none;
}
.button{
  display:inline-block;
  padding:14px 22px;
  background:#ff7043;
  color:white;
  border-radius:8px;
}
footer{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>
<body>

<header>
  <h1>副業で月5万円を目指すメディア</h1>
  <p>AI・副業・ブログ収益化を初心者向けに解説</p>
</header>

<div class="container">

  <div style="text-align:center; margin-bottom:30px;">
    <a class="button" href="#">無料で副業を始める</a>
  </div>

  <div class="grid" id="article-list">
    <div class="card">記事を読み込み中...</div>
  </div>

</div>

<footer>
  © 2026 副業メディア
</footer>

<script>
fetch("./articles.json")
.then(res => res.json())
.then(data => {
  const container = document.getElementById("article-list");
  container.innerHTML = "";

  data.slice().reverse().forEach(article => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h2>${article.title}</h2>
      <p>${article.summary}</p>
      <a href="article.html?id=${article.id}">
        続きを読む →
      </a>
    `;
    container.appendChild(div);
  });
});
</script>

</body>
</html>
