<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事ページ</title>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fa;
  margin:0;
}
.container{
  max-width:850px;
  margin:30px auto;
  background:white;
  padding:30px;
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
#content h2{
  margin-top:30px;
}
.button{
  display:inline-block;
  padding:14px 22px;
  background:#ff7043;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="container">
  <h1 id="title"></h1>
  <div id="content"></div>

  <div style="margin-top:40px; text-align:center;">
    <a class="button" href="#">無料で副業を始める</a>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = Number(params.get("id"));

fetch("./articles.json")
.then(res => res.json())
.then(data => {
  const article = data.find(a => a.id === id);

  if (!article) {
    document.getElementById("title").innerText = "記事が見つかりません";
    return;
  }

  document.getElementById("title").innerText = article.title;
let content = article.content;

// Markdownの簡易変換
content = content
  .replace(/^### (.*$)/gim, "<h3>$1</h3>")
  .replace(/^## (.*$)/gim, "<h2>$1</h2>")
  .replace(/\*\*(.*?)\*\*/gim, "<strong>$1</strong>")
  .replace(/\n\n/g, "</p><p>");

document.getElementById("content").innerHTML =
  "<p>" + content + "</p>";
});
</script>

</body>
</html>
