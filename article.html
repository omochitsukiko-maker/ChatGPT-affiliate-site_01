<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記事ページ</title>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fa;
  margin:0;
  color:#333;
  line-height:1.9;
}
.container{
  max-width:850px;
  margin:30px auto;
  background:white;
  padding:30px;
  border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
h1{
  font-size:32px;
  margin-bottom:30px;
}
#content h2{
  margin-top:35px;
  font-size:28px;
}
#content h3{
  margin-top:28px;
  font-size:22px;
}
#content p{
  margin:18px 0;
}
#content ul{
  padding-left:20px;
}
.cta-box{
  margin-top:40px;
  padding:24px;
  border-radius:12px;
  background:#fff3e0;
  text-align:center;
}
.button{
  display:inline-block;
  padding:14px 22px;
  background:#ff7043;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="container">
  <h1 id="title"></h1>
  <div id="content"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = Number(params.get("id"));

function markdownToHtml(text){
  return text
    .replace(/^### (.*$)/gim, "<h3>$1</h3>")
    .replace(/^## (.*$)/gim, "<h2>$1</h2>")
    .replace(/\*\*(.*?)\*\*/gim, "<strong>$1</strong>")
    .replace(/^\* (.*$)/gim, "<li>$1</li>")
    .replace(/\n\n/g, "</p><p>");
}

fetch("./articles.json?t=" + Date.now())
.then(res => res.json())
.then(data => {
  const article = data.find(a => a.id === id);

  if (!article) {
    document.getElementById("title").innerText = "記事が見つかりません";
    return;
  }

  document.getElementById("title").innerText = article.title;

  let content = article.content;

  if (!content.includes("<h2>") && !content.includes("<p>")) {
    content = "<p>" + markdownToHtml(content) + "</p>";
  }

  document.getElementById("content").innerHTML = content;
});
</script>

</body>
</html>
